<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypertrophy PWA</title>
  
  <link rel="manifest" href="manifest.json">
  
  <meta name="theme-color" content="#0D1320">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class', // Enable dark mode
      theme: {
        extend: {
          fontFamily: {
            sans: ['Nunito', 'ui-rounded', 'system-ui', 'sans-serif'],
          },
          colors: {
            // Redesign palette (Nov 2026): dark navy with a blue accent. New screens
            // use these names; ui.js holds the same hex values for SVG.
            ink: { DEFAULT: '#0D1320', card: '#161E2E', line: '#243049', key: '#1E2840', text: '#EEF2FA', muted: '#A3B0C7' },
            accent: { DEFAULT: '#4C9BFF', on: '#08111F', deep: '#1C3B66' },
            // Screens not rebuilt yet still say slate/blue/cyan, so those names are
            // re-pointed at the same palette. Each contrast pair still passes 4.5:1.
            slate: {
              50: '#F5F7FC', 100: '#EEF2FA', 200: '#D6DDEB', 300: '#BAC5D9', 400: '#A3B0C7',
              500: '#8592AD', 600: '#33405E', 700: '#243049', 800: '#161E2E', 850: '#121A28',
              900: '#0D1320', 950: '#080D17',
            },
            blue: {
              200: '#C4DDFF', 300: '#9CC8FF', 400: '#6BAEFF', 500: '#4C9BFF', 600: '#2A6FD6',
              700: '#225DB5', 800: '#1C3B66', 900: '#16294A',
            },
            cyan: {
              300: '#9CC8FF', 400: '#4C9BFF', 500: '#4C9BFF', 600: '#2A6FD6', 700: '#225DB5',
              800: '#1C3B66', 900: '#16294A',
            },
          },
          borderRadius: {
            lg: '1rem',
            xl: '1.25rem',
          },
        },
      },
    }
  </script>
  
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "chart.js": "https://esm.sh/chart.js@4.4.1",
      "chart.js/auto": "https://esm.sh/chart.js@4.4.1/auto",
      "react-chartjs-2": "https://esm.sh/react-chartjs-2@5.2.0?deps=react@18.2.0,chart.js@4.4.1"
    }
  }
  </script>

  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body {
      background: #0D1320;
      font-family: Nunito, ui-rounded, system-ui, sans-serif;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: none; } }
    @keyframes start-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(76, 155, 255, 0.35); }
      50% { box-shadow: 0 0 0 14px rgba(76, 155, 255, 0); }
    }
    .anim-fade-in { animation: fade-in 0.2s ease-out; }
    .anim-drawer-in { animation: drawer-in 0.26s cubic-bezier(.2, .8, .2, 1); }
    .start-pulse { animation: start-pulse 3s ease-in-out infinite; }
    @keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
    .anim-sheet-in { animation: sheet-in 0.28s cubic-bezier(.2, .8, .2, 1); }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(600deg); }
    }
    /* Pieces start above the screen, so if animations are off they simply never show. */
    .confetti-piece { position: absolute; top: -24px; animation-name: confetti-fall; animation-timing-function: cubic-bezier(.3, .6, .5, 1); animation-fill-mode: forwards; }
    @keyframes pr-pop { 0% { transform: scale(.4); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .pr-pop { animation: pr-pop 0.5s cubic-bezier(.2, .8, .2, 1); }
    /* The phone's Reduce Motion setting turns every animation and transition off. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 80px);
      right: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      z-index: 9999;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.success { background-color: #22c55e; color: white; }
    .toast.error { background-color: #ef4444; color: white; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 40;
    }
    .modal-content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      max-height: 80vh;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-ink text-ink-text dark">
  <div id="root"><p class="text-center text-slate-400 mt-24">Loading…</p></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>

  <script type="module" src="app.js"></script>
</body>
</html>
